permissions:
  contents: write
  releases: write

jobs:
  build-and-package:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'
        
    - name: Build project
      working-directory: ./
      run: dotnet build
      continue-on-error: false
      
    - name: Check build result
      if: failure()
      run: |
        echo "::error::Build failed! Check the build logs above for details."
        exit 1
        
    - name: Prepare files for packaging
      if: success()
      run: |
        # Copy DLLs from bin/Debug/ to root
        cp bin/Debug/net*/*.dll ./
        
        # Create staging directory
        mkdir -p staging
        
        # Copy required files to staging
        cp modinfo.json staging/
        cp icon.png staging/
        cp -r Assets/ staging/Assets/
        cp *.dll staging/
        
        # Create zip file name
        $version = (Get-Content modinfo.json | ConvertFrom-Json).Version
        $zip_name = "[API1.81]OTI-古茗岛$version.scmod"
        
        # Create zip package
        Compress-Archive -Path staging/* -DestinationPath $zip_name
        
        echo "PACKAGE_NAME=$zip_name" >> $env:GITHUB_ENV
        
    - name: Create release
      if: success()
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: release-${{ github.run_id }}
        release_name: ${{ env.PACKAGE_NAME }}
        draft: false
        prerelease: false
        
    - name: Upload release asset
      if: success()
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./${{ env.PACKAGE_NAME }}
        asset_name: ${{ env.PACKAGE_NAME }}
        asset_content_type: application/zip
        
    - name: Set release notes
      if: success()
      run: |
        # 使用GitHub CLI更新release notes
        if [ -d "UpdataLogs" ]; then
          notes=$(cat UpdataLogs/*)
        else
          notes="鸟和狗太懒了，什么都没有写喵-"
        fi
        
        gh api \
          --method PATCH \
          -H "Accept: application/vnd.github.v3+json" \
          /repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.id }} \
          -f body="$notes"